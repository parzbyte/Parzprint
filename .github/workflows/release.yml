name: Versão

# Ao marcar uma versão (git tag v1.2.3 + push), gera o Windows e o Linux, roda os testes,
# assina a origem de cada arquivo e publica tudo em Releases.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gerar:
    name: Gerar (${{ matrix.nome }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nome: windows
            arquivo: Parzprint-windows.zip
          - os: ubuntu-22.04
            nome: linux
            arquivo: Parzprint-linux.tar.gz
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Bibliotecas do Qt no Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-image0 libxcb-render-util0 libxcb-xinerama0 libxcb-shape0 \
            libxcb-randr0 libxcb-xfixes0 libdbus-1-3 libfontconfig1 libpulse0 fonts-dejavu-core

      - name: Instalar
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Testes (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m pip install pytest-timeout
          python -m pytest -q --timeout=60

      - name: Testes (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m pip install pytest-timeout
          xvfb-run -a python -m pytest -v --timeout=60

      - name: Gerar o executável
        run: python build.py

      # Só roda se houver um certificado de assinatura cadastrado nos segredos do repositório
      # (WINDOWS_CERT_PFX em base64 e WINDOWS_CERT_SENHA).
      - name: Assinar o executável (certificado da Microsoft)
        if: runner.os == 'Windows' && env.CERT != ''
        env:
          CERT: ${{ secrets.WINDOWS_CERT_PFX }}
          SENHA: ${{ secrets.WINDOWS_CERT_SENHA }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object FullName -like "*x64*" | Select-Object -Last 1
          & $signtool.FullName sign /f $pfx /p $env:SENHA /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 dist/Parzprint/Parzprint.exe
          Remove-Item $pfx

      - name: Empacotar (Windows)
        if: runner.os == 'Windows'
        run: 7z a -tzip -mx=5 ${{ matrix.arquivo }} ./dist/Parzprint

      - name: Empacotar (Linux)
        if: runner.os == 'Linux'
        run: tar -C dist -czf ${{ matrix.arquivo }} Parzprint

      - name: Assinar a origem do arquivo
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ matrix.arquivo }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.nome }}
          path: ${{ matrix.arquivo }}
          retention-days: 7

  publicar:
    name: Publicar em Releases
    needs: gerar
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: pacotes
          merge-multiple: true

      - name: Lista de SHA-256
        working-directory: pacotes
        run: sha256sum Parzprint-windows.zip Parzprint-linux.tar.gz > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Assinar a origem da lista
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: pacotes/SHA256SUMS.txt

      - uses: softprops/action-gh-release@v3
        with:
          name: Parzprint ${{ github.ref_name }}
          body: |
            Parzprint, por Parzbyte.

            **Windows:** baixe o `Parzprint-windows.zip`, extraia e abra o `Parzprint.exe`.
            **Linux:** baixe o `Parzprint-linux.tar.gz`, extraia e rode `./Parzprint/Parzprint`. A gravação de tela é só do Windows por enquanto.

            Os arquivos foram gerados pelo GitHub a partir deste repositório, com a origem assinada. Para conferir:

            ```
            gh attestation verify Parzprint-windows.zip --repo parzbyte/Parzprint
            ```

            O SHA-256 de cada arquivo está em `SHA256SUMS.txt`.
          files: |
            pacotes/Parzprint-windows.zip
            pacotes/Parzprint-linux.tar.gz
            pacotes/SHA256SUMS.txt
